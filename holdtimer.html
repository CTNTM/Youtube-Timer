<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A simple stopwatch for timing how long you hold each keyboard key." />
  <title>HoldTimer — Key Hold Stopwatch</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #68738a;
      --line: #e5e9f1;
      --paper: #ffffff;
      --canvas: #f6f7fb;
      --shadow: 0 22px 60px rgba(31, 42, 68, 0.12);
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 4%, rgba(255, 210, 120, 0.18), transparent 25rem),
        radial-gradient(circle at 92% 18%, rgba(122, 209, 255, 0.16), transparent 27rem),
        var(--canvas);
    }

    button,
    input { font: inherit; }

    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(57, 128, 255, 0.35);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .page-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      font-weight: 800;
      font-size: 1.12rem;
      letter-spacing: -0.03em;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #ff5d70, #ff925f 48%, #ffc84d);
      box-shadow: 0 8px 18px rgba(255, 105, 91, 0.26);
      font-size: 1.1rem;
    }

    .topbar-note {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(420px, 1.2fr);
      gap: 22px;
      align-items: stretch;
    }

    .summary-card,
    .video-card,
    .tracker-panel {
      border: 1px solid rgba(211, 218, 232, 0.9);
      background: rgba(255, 255, 255, 0.93);
      box-shadow: var(--shadow);
    }

    .summary-card {
      display: flex;
      min-height: 330px;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 28px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 95% 3%, rgba(255, 173, 99, 0.26), transparent 11rem),
        rgba(255, 255, 255, 0.96);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #7b8499;
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p { margin-top: 0; }

    .summary-card h1 {
      max-width: 12ch;
      margin-bottom: 0;
      color: #161e30;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      line-height: 1.02;
      letter-spacing: -0.065em;
    }

    .total-time {
      margin: 20px 0 4px;
      color: #16213a;
      font-size: clamp(3rem, 7vw, 5.7rem);
      font-weight: 800;
      line-height: 0.94;
      letter-spacing: -0.08em;
      font-variant-numeric: tabular-nums;
    }

    .total-caption {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .summary-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 24px 0 0;
    }

    .summary-stat {
      padding: 14px;
      border: 1px solid #edf0f5;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.72);
    }

    .summary-stat dt {
      margin-bottom: 5px;
      color: #7a8498;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .summary-stat dd {
      margin: 0;
      color: #25304a;
      font-size: 1.18rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .video-card {
      min-height: 330px;
      padding: 18px;
      border-radius: 26px;
    }

    .video-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 3px 5px 14px;
    }

    .video-heading h2 {
      margin-bottom: 0;
      font-size: 1rem;
      letter-spacing: -0.02em;
    }

    .video-heading span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .video-frame {
      position: relative;
      display: grid;
      min-height: 190px;
      overflow: hidden;
      place-items: center;
      border: 1px solid #e7eaf1;
      border-radius: 18px;
      background: linear-gradient(145deg, #1c2437, #323d58);
    }

    .video-frame::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
      background: linear-gradient(115deg, rgba(255, 255, 255, 0.1), transparent 33%);
    }

    .video-frame iframe {
      position: absolute;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-placeholder {
      z-index: 0;
      width: min(300px, 88%);
      color: #fff;
      text-align: center;
    }

    .play-icon {
      display: grid;
      width: 43px;
      height: 43px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 14px;
      color: #fff;
      background: #ff5d66;
      box-shadow: 0 10px 24px rgba(255, 77, 89, 0.35);
      font-size: 1.05rem;
      padding-left: 2px;
    }

    .video-placeholder strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.98rem;
    }

    .video-placeholder p {
      margin-bottom: 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .video-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
      margin-top: 13px;
    }

    .video-form input {
      width: 100%;
      min-width: 0;
      height: 43px;
      padding: 0 13px;
      border: 1px solid #dfe4ee;
      border-radius: 12px;
      color: var(--ink);
      background: #fff;
      font-size: 0.86rem;
    }

    .video-form input::placeholder { color: #9aa3b5; }

    .video-form button,
    .reset-button {
      min-height: 43px;
      border: 0;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 800;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .video-form button {
      padding: 0 16px;
      color: #fff;
      background: #273451;
      box-shadow: 0 7px 14px rgba(39, 52, 81, 0.18);
    }

    .video-form button:hover,
    .reset-button:hover { transform: translateY(-1px); }

    .video-feedback {
      min-height: 1.2em;
      margin: 8px 4px 0;
      color: #6e778a;
      font-size: 0.76rem;
    }

    .video-feedback.is-error { color: #d44755; }

    .tracker-panel {
      margin-top: 22px;
      padding: 25px;
      border-radius: 26px;
    }

    .tracker-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .tracker-toolbar h2 {
      margin: 0 0 6px;
      font-size: clamp(1.3rem, 2.6vw, 1.65rem);
      letter-spacing: -0.04em;
    }

    .tracker-toolbar p {
      max-width: 610px;
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .reset-button {
      flex: 0 0 auto;
      padding: 0 15px;
      border: 1px solid #e5e8ef;
      color: #6c7586;
      background: #fff;
    }

    .reset-button:hover {
      border-color: #ffbec5;
      color: #d84c5b;
      background: #fff8f8;
    }

    .live-strip {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin: 24px 0 17px;
      padding: 11px 13px;
      border: 1px solid #e8ebf1;
      border-radius: 15px;
      color: #5e687d;
      background: #fafbfc;
      font-size: 0.84rem;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #adb5c4;
      transition: background 180ms ease, box-shadow 180ms ease;
    }

    .live-dot.is-active {
      background: #1bbf81;
      box-shadow: 0 0 0 5px rgba(27, 191, 129, 0.14);
    }

    #activeCount {
      color: #798396;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .activity-track {
      position: relative;
      width: min(100%, 420px);
      height: 12px;
      margin: 0 auto 22px;
      padding: 2px;
      border: 1px solid #e8eaf0;
      border-radius: 999px;
      background: #eef1f5;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }

    .activity-track .activity-segment {
      position: absolute;
      top: 2px;
      bottom: 2px;
      border-radius: 999px;
      background: var(--segment-color, #aab2c1);
      transition: left 220ms ease, width 220ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .activity-track .activity-segment.is-active {
      transform: translateY(-1px);
      box-shadow: 0 5px 12px color-mix(in srgb, var(--segment-color) 18%, transparent);
    }

    .key-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .key-card {
      --accent: #ff5e70;
      --accent-soft: #fff0f2;
      --accent-ink: #b93649;
      position: relative;
      overflow: hidden;
      min-width: 0;
      padding: 18px;
      border: 1px solid #e8ebf1;
      border-radius: 20px;
      background: #fff;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .key-card[data-tone="blue"] {
      --accent: #5d77ff;
      --accent-soft: #eef0ff;
      --accent-ink: #4057d9;
    }

    .key-card[data-tone="lime"] {
      --accent: #64c766;
      --accent-soft: #eff9ef;
      --accent-ink: #358d3b;
    }

    .key-card::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      content: "";
      background: var(--accent);
    }

    .key-card.is-active {
      border-color: color-mix(in srgb, var(--accent) 43%, #fff);
      box-shadow: 0 16px 32px color-mix(in srgb, var(--accent) 18%, transparent);
      transform: translateY(-3px);
    }

    .key-card.is-rebinding {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 17%, transparent);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .timer-number {
      margin: 0 0 6px;
      color: #8b94a6;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .label-input {
      width: 100%;
      max-width: 150px;
      padding: 2px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      color: #202a40;
      background: transparent;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .label-input:hover,
    .label-input:focus { border-bottom-color: #c9cfdb; }

    .timer-state {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 999px;
      color: #7a8495;
      background: #f3f5f8;
      font-size: 0.68rem;
      font-weight: 800;
    }

    .key-card.is-active .timer-state {
      color: var(--accent-ink);
      background: var(--accent-soft);
    }

    .key-button {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 116px;
      margin: 20px 0 16px;
      padding: 12px;
      overflow: hidden;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, #fff);
      border-bottom-width: 6px;
      border-radius: 18px;
      color: var(--accent-ink);
      background: var(--accent-soft);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.86);
      transition: transform 130ms ease, border-bottom-width 130ms ease, background 130ms ease;
    }

    .key-button::before {
      position: absolute;
      inset: 0 auto auto 0;
      width: var(--press-progress, 0%);
      height: 100%;
      content: "";
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 18%, transparent) 0%, color-mix(in srgb, var(--accent) 35%, transparent) 100%);
      transition: width 120ms linear, opacity 120ms ease;
      pointer-events: none;
    }

    .key-button:hover { background: color-mix(in srgb, var(--accent-soft) 72%, #fff); }

    .key-button:active,
    .key-card.is-rebinding .key-button {
      border-bottom-width: 2px;
      transform: translateY(4px);
    }

    .key-button .key-display {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(2.8rem, 6vw, 4.3rem);
      font-weight: 800;
      line-height: 0.82;
      letter-spacing: -0.11em;
    }

    .key-button .key-change-hint {
      display: block;
      margin-top: 10px;
      color: color-mix(in srgb, var(--accent-ink) 73%, #fff);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .hold-reading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .hold-reading span,
    .timer-stats dt {
      color: #7f899c;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .hold-reading strong {
      color: #202b42;
      font-size: 1.42rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }

    .timer-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0;
    }

    .timer-stats > div {
      padding: 10px;
      border-radius: 11px;
      background: #f8f9fb;
    }

    .timer-stats dt { margin-bottom: 3px; }

    .timer-stats dd {
      margin: 0;
      color: #364058;
      font-size: 0.94rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .key-hint {
      margin: 15px 0 0;
      color: #778194;
      font-size: 0.74rem;
      line-height: 1.4;
    }

    kbd {
      display: inline-block;
      min-width: 1.55em;
      padding: 1px 5px;
      border: 1px solid #d8dde7;
      border-bottom-width: 2px;
      border-radius: 5px;
      color: #3f4960;
      background: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
    }

    .tips {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 2px 0;
      color: #788297;
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .tips svg { flex: 0 0 auto; }

    [hidden] { display: none !important; }

    @media (max-width: 800px) {
      .hero-grid { grid-template-columns: 1fr; }
      .summary-card,
      .video-card { min-height: 0; }
      .video-frame { min-height: 245px; }
      .key-grid { grid-template-columns: 1fr; }
      .key-card { padding: 20px; }
      .key-button { min-height: 108px; }
    }

    @media (max-width: 560px) {
      .page-shell { width: min(100% - 22px, 1180px); padding-top: 18px; }
      .topbar { align-items: flex-start; margin-bottom: 20px; }
      .topbar-note { max-width: 12ch; text-align: right; }
      .summary-card,
      .tracker-panel { padding: 20px; border-radius: 21px; }
      .video-card { padding: 13px; border-radius: 21px; }
      .tracker-toolbar { flex-direction: column; gap: 14px; }
      .reset-button { width: 100%; }
      .live-strip { grid-template-columns: auto 1fr; }
      #activeCount { grid-column: 2; }
      .video-form { grid-template-columns: 1fr; }
      .video-form button { width: 100%; }
      .activity-track { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <style>
    body {
      margin: 0;
      padding: 16px;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.4;
      background: #f3f4f6;
    }

    .page-shell {
      max-width: 720px;
      margin: 0 auto;
    }

    .panel {
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #d1d5db;
      background: #fff;
    }

    h1, h2, p { margin: 0 0 8px; }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .muted {
      color: #6b7280;
      font-size: 0.95rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .summary-box {
      padding: 8px;
      border: 1px solid #e5e7eb;
      background: #fafafa;
    }

    .summary-box .label {
      display: block;
      color: #6b7280;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .summary-box strong {
      display: block;
      margin-top: 2px;
      font-size: 1.04rem;
      font-variant-numeric: tabular-nums;
    }

    .live-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #9ca3af;
    }

    .live-dot.is-active {
      background: #16a34a;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.16);
    }

    #activeCount {
      margin-left: auto;
      color: #6b7280;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .activity-track {
      position: relative;
      height: 10px;
      overflow: hidden;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .activity-segment {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: var(--segment-color, #9ca3af);
    }

    .video-form {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .video-form input,
    .video-form button,
    .reset-button,
    .key-button,
    .label-input {
      font: inherit;
    }

    .video-form input {
      flex: 1;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid #d1d5db;
      background: #fff;
    }

    .video-form button,
    .reset-button {
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      cursor: pointer;
    }

    .video-frame {
      min-height: 120px;
      padding: 10px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .video-placeholder {
      color: #6b7280;
      font-size: 0.95rem;
    }

    .video-frame iframe {
      width: 100%;
      height: 180px;
      border: 0;
    }

    .video-feedback {
      margin: 8px 0 0;
      color: #6b7280;
      font-size: 0.84rem;
    }

    .video-feedback.is-error {
      color: #b91c1c;
    }

    .key-grid {
      display: grid;
      gap: 8px;
    }

    .key-card {
      --accent: #ff5e70;
      --accent-soft: #fef2f2;
      --accent-ink: #b91c1c;
      padding: 10px;
      border: 1px solid #e5e7eb;
      background: #fff;
    }

    .key-card[data-tone="blue"] {
      --accent: #5d77ff;
      --accent-soft: #eff6ff;
      --accent-ink: #1d4ed8;
    }

    .key-card[data-tone="lime"] {
      --accent: #6dca67;
      --accent-soft: #f0fdf4;
      --accent-ink: #15803d;
    }

    .key-card.is-active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .timer-number {
      margin: 0 0 2px;
      color: #6b7280;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .label-input {
      width: 100%;
      border: 0;
      padding: 0;
      color: #111827;
      background: transparent;
    }

    .timer-state {
      padding: 3px 7px;
      border-radius: 999px;
      color: #4b5563;
      background: #f3f4f6;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .key-card.is-active .timer-state {
      color: var(--accent-ink);
      background: color-mix(in srgb, var(--accent) 20%, #fff);
    }

    .key-button {
      position: relative;
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, #fff);
      border-bottom-width: 4px;
      border-radius: 10px;
      color: var(--accent-ink);
      background: var(--accent-soft);
      cursor: pointer;
    }

    .key-button::before {
      position: absolute;
      inset: 0 auto auto 0;
      width: var(--press-progress, 0%);
      height: 100%;
      content: "";
      background: color-mix(in srgb, var(--accent) 20%, transparent);
      pointer-events: none;
    }

    .key-button .key-display {
      position: relative;
      display: block;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .key-button .key-change-hint {
      position: relative;
      display: block;
      margin-top: 3px;
      color: color-mix(in srgb, var(--accent-ink) 80%, #fff);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .hold-reading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .hold-reading span { color: #6b7280; }

    .hold-reading strong {
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }

    .timer-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin: 0;
    }

    .timer-stats > div {
      padding: 7px;
      border: 1px solid #e5e7eb;
      background: #fafafa;
    }

    .timer-stats dt {
      color: #6b7280;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .timer-stats dd {
      margin: 2px 0 0;
      font-size: 0.92rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .key-hint {
      margin: 8px 0 0;
      color: #6b7280;
      font-size: 0.82rem;
    }

    .tips {
      margin-top: 8px;
      color: #6b7280;
      font-size: 0.82rem;
    }

    @media (max-width: 560px) {
      body { padding: 10px; }
      .summary-grid { grid-template-columns: 1fr; }
      .video-form { flex-direction: column; }
    }

    .page-shell {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .shell {
      padding: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .search-pill {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #fafafa;
      color: #111827;
    }

    .search-pill .emoji {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 50%;
      background: #f3f4f6;
      font-size: 0.95rem;
    }

    .search-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
    }

    .search-message {
      font-size: 0.95rem;
      color: #111827;
    }

    .mini-button {
      padding: 8px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #fff;
      color: #111827;
      cursor: pointer;
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      color: #6b7280;
      font-size: 0.9rem;
    }

    .stats-row span {
      padding: 6px 8px;
      border: 1px solid #f3f4f6;
      border-radius: 999px;
      background: #fcfcfd;
    }

    .timeline-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .timeline-row #activeCount {
      margin-left: 0;
      color: #6b7280;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .timeline-row .activity-track {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: #eceff3;
    }

    .timeline-row .activity-segment {
      border-radius: 999px;
    }

    .video-row {
      margin-bottom: 12px;
    }

    .video-row details {
      border: 1px solid #f3f4f6;
      border-radius: 12px;
      background: #fcfcfd;
    }

    .video-row summary {
      padding: 8px 10px;
      color: #6b7280;
      cursor: pointer;
      list-style: none;
    }

    .video-row summary::-webkit-details-marker { display: none; }

    .video-row .video-form {
      display: flex;
      gap: 8px;
      padding: 0 10px 10px;
    }

    .video-row input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #fff;
    }

    .video-row button {
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
    }

    .video-row .video-frame {
      margin: 0 10px 10px;
      padding: 10px;
      border: 1px solid #f3f4f6;
      border-radius: 12px;
      background: #fff;
    }

    .video-row .video-placeholder {
      color: #9ca3af;
      font-size: 0.9rem;
    }

    .video-row .video-feedback {
      margin: 8px 10px 0;
      font-size: 0.8rem;
    }

    .key-grid {
      display: grid;
      gap: 8px;
    }

    .key-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #fff;
    }

    .key-card.is-active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }

    .timer-number,
    .timer-state,
    .hold-reading,
    .timer-stats,
    .key-hint,
    .label-input {
      display: none;
    }

    .key-button {
      flex: 1;
      min-height: auto;
      margin: 0;
      padding: 6px 10px;
      border: 0;
      border-radius: 999px;
      color: var(--accent-ink);
      background: transparent;
      text-align: left;
      box-shadow: none;
    }

    .key-button::before {
      display: none;
    }

    .key-button .key-display {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .key-button .key-change-hint {
      display: inline-block;
      margin-left: 6px;
      color: color-mix(in srgb, var(--accent-ink) 70%, #fff);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    @media (max-width: 560px) {
      .search-row { flex-direction: column; align-items: stretch; }
      .mini-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="shell" aria-label="Minimal timer interface">
      <div class="search-row">
        <div class="search-pill" role="status" aria-live="polite">
          <span class="emoji" aria-hidden="true">⌘</span>
          <div>
            <div class="search-label">HoldTimer</div>
            <div class="search-message" id="liveMessage">Ready — hold H, K, or L.</div>
          </div>
        </div>
        <button class="mini-button" id="resetButton" type="button">Reset</button>
      </div>

      <div class="stats-row">
        <span>Total: <strong id="grandTotal">0.00s</strong></span>
        <span>Presses: <strong id="grandPresses">0</strong></span>
        <span>Active: <strong id="activeKeys">0</strong></span>
      </div>

      <div class="timeline-row">
        <span class="live-dot" id="liveDot" aria-hidden="true"></span>
        <div class="activity-track" id="activityTrack" aria-hidden="true"></div>
        <span id="activeCount">0 active</span>
      </div>

      <div class="video-row">
        <details>
          <summary>Video</summary>
          <form class="video-form" id="videoForm">
            <label class="sr-only" for="videoUrl">YouTube video link</label>
            <input id="videoUrl" type="url" inputmode="url" autocomplete="url" placeholder="Paste a YouTube link…" />
            <button type="submit">Load</button>
          </form>
          <p class="video-feedback" id="videoFeedback" aria-live="polite">Optional.</p>
          <div class="video-frame">
            <div class="video-placeholder" id="videoPlaceholder">No video loaded.</div>
            <iframe
              id="youtubeFrame"
              title="Embedded YouTube video"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
              hidden></iframe>
          </div>
        </details>
      </div>

      <div class="key-grid" id="keyGrid"></div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const SETTINGS_KEY = "hold-timer-settings-v1";
      const timerDefaults = [
        { id: "coral", tone: "coral", code: "KeyH", key: "H", label: "First task" },
        { id: "blue", tone: "blue", code: "KeyK", key: "K", label: "Second task" },
        { id: "lime", tone: "lime", code: "KeyL", key: "L", label: "Third task" }
      ];

      const timers = timerDefaults.map((timer) => ({
        ...timer,
        total: 0,
        count: 0,
        startedAt: null,
        lastHold: 0
      }));

      const refs = new Map();
      let pendingBindingId = null;
      let animationFrameId = null;
      let holdHistory = [];

      const grandTotal = document.getElementById("grandTotal");
      const grandPresses = document.getElementById("grandPresses");
      const activeKeys = document.getElementById("activeKeys");
      const keyGrid = document.getElementById("keyGrid");
      const liveDot = document.getElementById("liveDot");
      const liveMessage = document.getElementById("liveMessage");
      const activeCount = document.getElementById("activeCount");
      const resetButton = document.getElementById("resetButton");
      const videoForm = document.getElementById("videoForm");
      const videoUrl = document.getElementById("videoUrl");
      const youtubeFrame = document.getElementById("youtubeFrame");
      const videoPlaceholder = document.getElementById("videoPlaceholder");
      const videoFeedback = document.getElementById("videoFeedback");
      const activityTrack = document.getElementById("activityTrack");

      function getTimer(id) {
        return timers.find((timer) => timer.id === id);
      }

      function formatDuration(milliseconds) {
        const safeMilliseconds = Math.max(0, milliseconds || 0);
        const centiseconds = Math.floor((safeMilliseconds % 1000) / 10);
        const wholeSeconds = Math.floor(safeMilliseconds / 1000);
        const seconds = wholeSeconds % 60;
        const minutes = Math.floor(wholeSeconds / 60);
        const base = minutes > 0
          ? `${minutes}:${String(seconds).padStart(2, "0")}`
          : String(seconds);
        return `${base}.${String(centiseconds).padStart(2, "0")}s`;
      }

      function displayKey(event) {
        if (event.key === " ") return "Space";
        if (event.key.length === 1) return event.key.toUpperCase();
        const replacements = {
          ArrowUp: "↑",
          ArrowDown: "↓",
          ArrowLeft: "←",
          ArrowRight: "→"
        };
        return replacements[event.key] || event.key;
      }

      function isEditableTarget(target) {
        return target instanceof Element && Boolean(target.closest("input, textarea, select, [contenteditable='true']"));
      }

      function isUsableBinding(event) {
        const excluded = new Set([
          "AltLeft", "AltRight", "ControlLeft", "ControlRight", "MetaLeft", "MetaRight",
          "ShiftLeft", "ShiftRight", "CapsLock", "Tab", "Escape"
        ]);
        return Boolean(event.code) && !excluded.has(event.code);
      }

      function currentHold(timer, now) {
        return timer.startedAt === null ? 0 : Math.max(0, now - timer.startedAt);
      }

      function timerTotal(timer, now) {
        return timer.total + currentHold(timer, now);
      }

      function allTotal(now) {
        return timers.reduce((total, timer) => total + timerTotal(timer, now), 0);
      }

      function activeTimers() {
        return timers.filter((timer) => timer.startedAt !== null);
      }

      function saveSettings() {
        try {
          const settings = timers.map(({ id, code, key, label }) => ({ id, code, key, label }));
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        } catch (error) {
          // Timing still works when browser storage is unavailable.
        }
      }

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
          if (!Array.isArray(saved) || saved.length !== timers.length) return;
          const codes = saved.map((setting) => setting && setting.code);
          if (codes.some((code) => typeof code !== "string") || new Set(codes).size !== timers.length) return;

          saved.forEach((setting) => {
            const timer = getTimer(setting.id);
            if (!timer || typeof setting.key !== "string" || typeof setting.label !== "string") return;
            timer.code = setting.code;
            timer.key = setting.key.slice(0, 16);
            timer.label = setting.label.slice(0, 32).trim() || timer.label;
          });
        } catch (error) {
          // Use the friendly default keys if saved settings are missing or invalid.
        }
      }

      function makeElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function createStat(label) {
        const wrapper = document.createElement("div");
        const term = makeElement("dt", "", label);
        const definition = makeElement("dd", "", "0.00s");
        wrapper.append(term, definition);
        return { wrapper, definition };
      }

      function buildTimerCards() {
        keyGrid.replaceChildren();
        timers.forEach((timer, index) => {
          const card = makeElement("article", "key-card");
          card.dataset.timerId = timer.id;
          card.dataset.tone = timer.tone;

          const cardTop = makeElement("div", "card-top");
          const titleBlock = document.createElement("div");
          titleBlock.append(makeElement("p", "timer-number", `Timer ${String(index + 1).padStart(2, "0")}`));

          const labelInput = document.createElement("input");
          labelInput.className = "label-input";
          labelInput.type = "text";
          labelInput.value = timer.label;
          labelInput.maxLength = 32;
          labelInput.setAttribute("aria-label", `Name for timer ${index + 1}`);
          labelInput.addEventListener("input", () => {
            timer.label = labelInput.value.trim() || `Timer ${index + 1}`;
            refs.get(timer.id).keyButton.setAttribute("aria-label", `Change key for ${timer.label}`);
            saveSettings();
          });
          labelInput.addEventListener("blur", () => {
            if (!labelInput.value.trim()) labelInput.value = timer.label;
          });

          titleBlock.append(labelInput);
          const state = makeElement("span", "timer-state", "Ready");
          cardTop.append(titleBlock, state);

          const keyButton = makeElement("button", "key-button");
          keyButton.type = "button";
          const keyDisplay = makeElement("span", "key-display", timer.key);
          const keyHint = makeElement("span", "key-change-hint", "Click to change key");
          keyButton.append(keyDisplay, keyHint);
          keyButton.addEventListener("click", () => beginRebinding(timer));

          const holdReading = makeElement("div", "hold-reading");
          const holdCaption = makeElement("span", "hold-caption", "Last hold");
          const holdValue = makeElement("strong", "hold-value", "0.00s");
          holdReading.append(holdCaption, holdValue);

          const stats = makeElement("dl", "timer-stats");
          const totalStat = createStat("Total time");
          const countStat = createStat("Presses");
          countStat.definition.textContent = "0";
          stats.append(totalStat.wrapper, countStat.wrapper);

          const hint = makeElement("p", "key-hint");
          hint.append("Hold ");
          const hintKey = makeElement("kbd", "", timer.key);
          hint.append(hintKey, " to time this task.");

          card.append(cardTop, keyButton, holdReading, stats, hint);
          keyGrid.append(card);
          refs.set(timer.id, {
            card,
            labelInput,
            state,
            keyButton,
            keyDisplay,
            keyHint,
            holdCaption,
            holdValue,
            totalValue: totalStat.definition,
            countValue: countStat.definition,
            hintKey
          });
        });
      }

      function updateTimerIdentity(timer) {
        const ref = refs.get(timer.id);
        if (!ref) return;
        ref.keyDisplay.textContent = timer.key;
        ref.hintKey.textContent = timer.key;
        ref.keyButton.setAttribute("aria-label", `Change key for ${timer.label}`);
      }

      function renderActivityBar(now) {
        const active = activeTimers();
        const segments = [
          ...holdHistory.map((entry) => ({ ...entry, duration: entry.duration }))
        ];

        active.forEach((timer) => {
          segments.push({
            timerId: timer.id,
            tone: timer.tone,
            duration: currentHold(timer, now),
            isActive: true
          });
        });

        const totalDuration = segments.reduce((sum, segment) => sum + segment.duration, 0);
        activityTrack.replaceChildren();

        if (segments.length === 0 || totalDuration <= 0) {
          const emptySegment = makeElement("span", "activity-segment");
          emptySegment.style.left = "0%";
          emptySegment.style.width = "100%";
          emptySegment.style.setProperty("--segment-color", "#d7dce5");
          activityTrack.append(emptySegment);
          return;
        }

        let cursor = 0;
        segments.forEach((segment) => {
          const widthPercent = Math.max(0, Math.min(100 - cursor, (segment.duration / totalDuration) * 100));
          if (widthPercent <= 0) return;

          const element = makeElement("span", "activity-segment");
          element.style.left = `${cursor}%`;
          element.style.width = `${widthPercent}%`;
          element.style.setProperty("--segment-color", segment.tone === "coral" ? "#ff5e70" : segment.tone === "blue" ? "#5d77ff" : "#6dca67");
          if (segment.isActive) element.classList.add("is-active");
          activityTrack.append(element);
          cursor += widthPercent;
        });
      }

      function render(now = performance.now()) {
        const active = activeTimers();
        timers.forEach((timer) => {
          const ref = refs.get(timer.id);
          const isActive = timer.startedAt !== null;
          const hold = isActive ? currentHold(timer, now) : timer.lastHold;
          ref.card.classList.toggle("is-active", isActive);
          ref.card.classList.toggle("is-rebinding", pendingBindingId === timer.id);
          ref.state.textContent = isActive ? "Holding" : pendingBindingId === timer.id ? "Choose key" : "Ready";
          ref.holdCaption.textContent = isActive ? "This hold" : "Last hold";
          ref.holdValue.textContent = formatDuration(hold);
          ref.totalValue.textContent = formatDuration(timerTotal(timer, now));
          ref.countValue.textContent = String(timer.count);
          ref.keyHint.textContent = pendingBindingId === timer.id ? "Press a key now" : "Click to change key";
      ref.keyButton.style.setProperty("--press-progress", isActive ? "100%" : "0%");
      ref.keyButton.classList.toggle("is-pressing", isActive);
        });

        renderActivityBar(now);
        grandTotal.textContent = formatDuration(allTotal(now));
        grandPresses.textContent = String(timers.reduce((count, timer) => count + timer.count, 0));
        activeKeys.textContent = String(active.length);
        activeCount.textContent = `${active.length} active`;
        liveDot.classList.toggle("is-active", active.length > 0);
      }

      function startAnimation() {
        if (animationFrameId !== null) return;
        const tick = (now) => {
          render(now);
          if (activeTimers().length > 0) {
            animationFrameId = requestAnimationFrame(tick);
          } else {
            animationFrameId = null;
          }
        };
        animationFrameId = requestAnimationFrame(tick);
      }

      function setLiveMessage(message) {
        liveMessage.textContent = message;
      }

      function startHold(timer, now = performance.now()) {
        if (timer.startedAt !== null) return;
        timer.startedAt = now;
        timer.count += 1;
        setLiveMessage(`Timing ${timer.label} with ${timer.key}. Release the key when you are done.`);
        render(now);
        startAnimation();
      }

      function finishHold(timer, now = performance.now(), announce = true) {
        if (timer.startedAt === null) return false;
        const duration = currentHold(timer, now);
        timer.total += duration;
        timer.lastHold = duration;
        holdHistory.push({ timerId: timer.id, tone: timer.tone, duration });
        timer.startedAt = null;
        render(now);
        if (announce) setLiveMessage(`${timer.label}: ${formatDuration(duration)} added to your total.`);
        return true;
      }

      function finishAllHolds(reason) {
        const now = performance.now();
        const finished = timers.filter((timer) => finishHold(timer, now, false));
        if (finished.length > 0) {
          setLiveMessage(reason || "Active holds were saved.");
          render(now);
        }
      }

      function beginRebinding(timer) {
        if (timer.startedAt !== null) finishHold(timer);
        pendingBindingId = timer.id;
        setLiveMessage(`Choose a new key for ${timer.label}. Press Escape to cancel.`);
        render();
      }

      function cancelRebinding() {
        if (!pendingBindingId) return;
        pendingBindingId = null;
        setLiveMessage("Key change cancelled. Your existing key is still ready.");
        render();
      }

      function completeRebinding(event) {
        const timer = getTimer(pendingBindingId);
        if (!timer) return;
        if (event.code === "Escape") {
          cancelRebinding();
          return;
        }
        if (!isUsableBinding(event)) {
          setLiveMessage("Please choose a regular key, number, arrow, or space bar.");
          return;
        }
        const alreadyUsed = timers.find((candidate) => candidate.id !== timer.id && candidate.code === event.code);
        if (alreadyUsed) {
          setLiveMessage(`${displayKey(event)} is already used by ${alreadyUsed.label}. Choose another key.`);
          return;
        }
        timer.code = event.code;
        timer.key = displayKey(event);
        pendingBindingId = null;
        updateTimerIdentity(timer);
        saveSettings();
        setLiveMessage(`${timer.label} is now assigned to ${timer.key}.`);
        render();
      }

      function resetSession() {
        if (animationFrameId !== null) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        holdHistory = [];
        timers.forEach((timer) => {
          timer.total = 0;
          timer.count = 0;
          timer.startedAt = null;
          timer.lastHold = 0;
        });
        setLiveMessage("Session reset. Hold one of your keys to begin again.");
        render();
      }

      function extractYoutubeId(value) {
        const raw = value.trim();
        if (/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;
        let url;
        try {
          url = new URL(raw);
        } catch (error) {
          return null;
        }

        const host = url.hostname.replace(/^www\./, "").toLowerCase();
        let id = null;
        if (host === "youtu.be") {
          id = url.pathname.split("/").filter(Boolean)[0];
        } else if (host === "youtube.com" || host.endsWith(".youtube.com") || host === "youtube-nocookie.com") {
          const parts = url.pathname.split("/").filter(Boolean);
          if (url.pathname === "/watch") id = url.searchParams.get("v");
          else if (["embed", "shorts", "live"].includes(parts[0])) id = parts[1];
        }
        return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
      }

      function loadVideo(event) {
        event.preventDefault();
        const id = extractYoutubeId(videoUrl.value);
        if (!id) {
          videoFeedback.textContent = "That does not look like a YouTube video link. Try a full youtube.com or youtu.be URL.";
          videoFeedback.classList.add("is-error");
          return;
        }
        youtubeFrame.src = `https://www.youtube-nocookie.com/embed/${id}?rel=0`;
        youtubeFrame.hidden = false;
        videoPlaceholder.hidden = true;
        videoFeedback.textContent = "Video loaded. Your timers are still ready to use.";
        videoFeedback.classList.remove("is-error");
      }

      window.addEventListener("keydown", (event) => {
        if (pendingBindingId) {
          event.preventDefault();
          completeRebinding(event);
          return;
        }
        if (isEditableTarget(event.target) || event.repeat) return;
        const timer = timers.find((candidate) => candidate.code === event.code);
        if (!timer) return;
        event.preventDefault();
        startHold(timer);
      });

      window.addEventListener("keyup", (event) => {
        const timer = timers.find((candidate) => candidate.code === event.code && candidate.startedAt !== null);
        if (!timer) return;
        event.preventDefault();
        finishHold(timer);
      });

      window.addEventListener("blur", () => finishAllHolds("You left the page, so active holds were saved."));
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) finishAllHolds("The page was hidden, so active holds were saved.");
      });
      resetButton.addEventListener("click", resetSession);
      videoForm.addEventListener("submit", loadVideo);

      loadSettings();
      buildTimerCards();
      timers.forEach(updateTimerIdentity);
      render();
    })();
  </script>
</body>
</html>
