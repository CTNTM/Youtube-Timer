<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keypress Stopwatch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }

    p.instruction {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .status-box {
      background: #0f172a;
      border: 2px dashed #334155;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      transition: all 0.15s ease;
    }

    .status-box.active {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      background: #1e293b;
    }

    .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 0.25rem;
    }

    .timer-display {
      font-size: 3rem;
      font-weight: 700;
      font-mono: monospace;
      color: #f8fafc;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .stat-card {
      background: #0f172a;
      padding: 1rem;
      border-radius: 10px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .reset-btn {
      margin-top: 1.5rem;
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .reset-btn:hover {
      border-color: #ef4444;
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Keypress Timer</h1>
    <p class="instruction">Press & hold <strong>any key</strong> to start timing.</p>

    <div class="status-box" id="statusBox">
      <div class="label">Current Hold Duration</div>
      <div class="timer-display" id="currentTimer">0.00s</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Total Press Count</div>
        <div class="stat-value" id="pressCount">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Time Held</div>
        <div class="stat-value" id="totalTime">0.00s</div>
      </div>
    </div>

    <button class="reset-btn" id="resetBtn">Reset All Stats</button>
  </div>

  <script>
    let isHolding = false;
    let startTime = 0;
    let currentHoldTime = 0;
    let totalHeldTime = 0;
    let count = 0;
    let animationFrameId = null;

    const currentTimerEl = document.getElementById('currentTimer');
    const pressCountEl = document.getElementById('pressCount');
    const totalTimeEl = document.getElementById('totalTime');
    const statusBox = document.getElementById('statusBox');
    const resetBtn = document.getElementById('resetBtn');

    function updateTimer() {
      if (!isHolding) return;
      currentHoldTime = (performance.now() - startTime) / 1000;
      currentTimerEl.textContent = currentHoldTime.toFixed(2) + 's';
      animationFrameId = requestAnimationFrame(updateTimer);
    }

    window.addEventListener('keydown', (event) => {
      // Prevent browser scrolling when holding spacebar
      if (event.code === 'Space') event.preventDefault();
      
      // Ignore key repeat events when key is held down
      if (event.repeat || isHolding) return;

      isHolding = true;
      startTime = performance.now();
      count++;
      pressCountEl.textContent = count;

      statusBox.classList.add('active');
      animationFrameId = requestAnimationFrame(updateTimer);
    });

    window.addEventListener('keyup', () => {
      if (!isHolding) return;

      isHolding = false;
      cancelAnimationFrame(animationFrameId);

      // Final calculation for this press
      currentHoldTime = (performance.now() - startTime) / 1000;
      totalHeldTime += currentHoldTime;

      currentTimerEl.textContent = currentHoldTime.toFixed(2) + 's';
      totalTimeEl.textContent = totalHeldTime.toFixed(2) + 's';
      statusBox.classList.remove('active');
    });

    resetBtn.addEventListener('click', () => {
      isHolding = false;
      cancelAnimationFrame(animationFrameId);
      count = 0;
      totalHeldTime = 0;
      currentHoldTime = 0;

      currentTimerEl.textContent = '0.00s';
      pressCountEl.textContent = '0';
      totalTimeEl.textContent = '0.00s';
      statusBox.classList.remove('active');
    });
  </script>
</body>
</html>
